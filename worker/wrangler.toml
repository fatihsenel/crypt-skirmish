# The loss-replay Worker (src/index.js). From this folder:
#   npx wrangler deploy              deploy it
#   npx wrangler secret put READ_KEY the key the ?losses page asks for
name = "crypt-skirmish-losses"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "crypt-skirmish-losses"
database_id = "5c59f9fc-b9da-4671-bb5d-04f577146975"

# At most 3 uploads a minute from one address (per Cloudflare location); see src/index.js.
[[ratelimits]]
name = "UPLOADS"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Play-stats events: at most 30 a minute from one address.
[[ratelimits]]
name = "EVENTS"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Co-op rooms (src/room.js): one Durable Object per room code, on SQLite storage.
[[durable_objects.bindings]]
name = "COOP"
class_name = "CoopRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CoopRoom"]

# Joining a co-op room: at most 20 sockets a minute from one address (reconnects included).
[[ratelimits]]
name = "ROOMS"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[triggers]
crons = ["17 3 * * *"]
