# The weekly digest (scripts/digest.mjs): every Monday, the last 7 days of play stats and stored
# losses from the loss-replay Worker (and visitors from Umami), saved as the run's "digest"
# artifact. The keys are the repository secrets LOSS_READ_KEY and UMAMI_API_KEY
# (gh secret set NAME), never a file. The report is
# kept out of the log and the job summary, since this repository is public.
name: Weekly digest

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # It needs no packages: node runs it straight from the checkout.
      - name: Build the report
        env:
          LOSS_READ_KEY: ${{ secrets.LOSS_READ_KEY }}
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
        run: node scripts/digest.mjs --out digest.md > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: digest
          path: digest.md
          retention-days: 30
      # A missing or refused key fails the run, so GitHub emails about it.
      - name: Check it could read everything
        run: "! grep -qE 'No read key|refused the|Couldn’t reach' digest.md"
