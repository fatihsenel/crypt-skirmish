name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # On a phone the first tap on a tile previews and the second acts: check it with real
      # touch events in headless Chrome against the build, before it goes live.
      - name: Touch check
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:4173/crypt-skirmish/ && break; sleep 1; done
          # Fixed fights: 3 has Brannoc move through Maela's figure, 1 Ilsa and 5 Wren first.
          for seed in 3 1 5; do SEED=$seed npm run touch-check; done
        env:
          URL: http://localhost:4173/crypt-skirmish/
          CHROME: google-chrome
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
